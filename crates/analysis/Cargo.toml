[package]
name = "tauwriter-analysis"
version = "0.1.0"
edition = "2021"

[dependencies]
salsa = "0.27"
tree-sitter = "0.26"
streaming-iterator = "0.1"
lsp-types = "0.94"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dashmap = "5"
ropey = "1.6"
walkdir = "2"
anyhow = "1.0"
thiserror = "1.0"
tauwriter-hubgs = { path = "../hubgs" }
tauwriter-twxml = { path = "../twxml" }
tauwriter-text = { path = "../text" }
tauwriter-paths = { path = "../paths" }
tauwriter-util = { path = "../util" }
graphene_core = { path = "../graphene_core" }

[build-dependencies]
cc = "1.0"
