[package]
name = "tauwriter-twxml"
version = "0.1.0"
edition = "2021"
authors = ["Jarbear82", "Gemini CLI"]
description = "Standalone TWXML document parser, block AST, outline extraction, and tree-sitter queries"

[dependencies]
tree-sitter = "0.26"
roxmltree = "0.20"
serde = { version = "1.0", features = ["derive"] }
anyhow = "1.0"
streaming-iterator = "0.1"

[build-dependencies]
cc = "1.0"
