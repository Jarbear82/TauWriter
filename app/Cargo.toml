[package]
name = "tauwriter-app"
version = "0.1.0"
edition = "2021"

[dependencies]
gpui = { git = "https://github.com/zed-industries/zed.git" }
gpui_platform = { git = "https://github.com/zed-industries/zed.git", features = ["wayland", "x11"] }
gpui-component = { git = "https://github.com/longbridge/gpui-component", features = ["tree-sitter"] }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component" }
graphene_core = { path = "../crates/graphene_core" }
graphene_layout = { path = "../crates/graphene_layout" }
graphene_gpui = { path = "../crates/graphene_gpui" }
graphene_style = { path = "../crates/graphene_style" }
anyhow = "1.0"
once_cell = "1.19"
tokio = { version = "1.0", features = ["full"] }
roxmltree = "0.20.0"
env_logger = "0.11"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tree-sitter = "0.26"
tauwriter-hubgs = { path = "../crates/hubgs" }
tauwriter-twxml = { path = "../crates/twxml" }
tauwriter-analysis = { path = "../crates/analysis" }
tauwriter-text = { path = "../crates/text" }

[build-dependencies]
cc = "1.0"
